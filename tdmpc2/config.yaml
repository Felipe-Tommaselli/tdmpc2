defaults:
    - override hydra/launcher: submitit_local

# environment
task: cropfollow
obs: state

# evaluation
checkpoint: ??? #ros_ws/tdmpc2/checkpoints/mt80-48M.pt
#checkpoint: /ros_ws/tdmpc2/tdmpc2/logs/cropfollow/1/default/models/2024-08-12_13-59-12.pt
eval_episodes: 10
eval_freq: 5000

# training
steps: 30_000
batch_size: 64
reward_coef: 0.1
value_coef: 0.1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995 
buffer_size: 1_000_000 # check if buffer size affects training steps
exp_name: default
data_dir: ???

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
model_size: 5
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 512
task_dim: 96
num_q: 5
dropout: 0.01
simnorm_dim: 8

# logging
wandb_project: Cropfollow-train
wandb_entity: f-tommaselli-USP - Universidade de São Paulo
wandb_silent: false
disable_wandb: false
save_csv: true

# misc
save_video: false
save_agent: true
seed: 1

# convenience
work_dir: ???
task_title: ???
multitask: ???
tasks: ???
obs_shape: 13440 #1081
action_dim: 2
max_ep_steps: 50
episode_length: ???
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: ???
bin_size: ???
